
[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "T20", "SIM"]
ignore = [
    "E501",  # line length is the formatter's job
    "B008",  # FastAPI's Depends() lives in default arguments by design
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
# Without this the console script `pytest` cannot import `app` at all — only
# `python -m pytest` works, because that form puts the working directory on
# sys.path and the script does not. 07-DEPLOYMENT.md's CI step runs `pytest`.
pythonpath = ["."]
markers = [
    "eval: spends money on a real AI provider; excluded from CI with -m 'not eval'",
]

[tool.mypy]
python_version = "3.14"
files = ["app", "scripts"]
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true